name: Generate Profile Assets

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # ===== Stats Cards =====
      - uses: cicirello/user-statistician@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          colors: dark
          max-languages: 8
          animated-language-chart: true
          commit-and-push: false

      - name: Move stats files
        run: |
          mkdir -p .github/assets
          mv images/userstats.svg .github/assets/stats-main.svg 2>/dev/null || true
          mv images/languagechart.svg .github/assets/stats-lang.svg 2>/dev/null || true

      # ===== Trophy Cards =====
      - name: Generate Stars Trophy
        uses: soulteary/github-profile-trophy-action@v1.0.0
        with:
          options: 'username=LOVE-U987&theme=juicyfresh&title=Stars&no-bg=true&no-frame=true'
          path: .github/assets/trophy-stars.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Commits Trophy
        uses: soulteary/github-profile-trophy-action@v1.0.0
        with:
          options: 'username=LOVE-U987&theme=onedark&title=Commits&no-bg=true&no-frame=true'
          path: .github/assets/trophy-commits.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Followers Trophy
        uses: soulteary/github-profile-trophy-action@v1.0.0
        with:
          options: 'username=LOVE-U987&theme=radical&title=Followers&no-bg=true&no-frame=true'
          path: .github/assets/trophy-followers.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Repos Trophy
        uses: soulteary/github-profile-trophy-action@v1.0.0
        with:
          options: 'username=LOVE-U987&theme=matrix&title=Repositories&no-bg=true&no-frame=true'
          path: .github/assets/trophy-repos.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Issues Trophy
        uses: soulteary/github-profile-trophy-action@v1.0.0
        with:
          options: 'username=LOVE-U987&theme=tokyonight&title=Issues&no-bg=true&no-frame=true'
          path: .github/assets/trophy-issues.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate PR Trophy
        uses: soulteary/github-profile-trophy-action@v1.0.0
        with:
          options: 'username=LOVE-U987&theme=dracula&title=PullRequest&no-bg=true&no-frame=true'
          path: .github/assets/trophy-pr.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Reviews Trophy
        uses: soulteary/github-profile-trophy-action@v1.0.0
        with:
          options: 'username=LOVE-U987&theme=nord&title=Reviews&no-bg=true&no-frame=true'
          path: .github/assets/trophy-reviews.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Experience Trophy
        uses: soulteary/github-profile-trophy-action@v1.0.0
        with:
          options: 'username=LOVE-U987&theme=gruvbox&title=Experience&no-bg=true&no-frame=true'
          path: .github/assets/trophy-exp.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # ===== Snake Animation =====
      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: LOVE-U987
          outputs: |
            dist/github-contribution-snake.svg
            dist/github-contribution-snake-dark.svg?palette=github-dark

      - name: Move snake files
        run: |
          mkdir -p output
          mv dist/github-contribution-snake.svg output/ 2>/dev/null || true
          mv dist/github-contribution-snake-dark.svg output/ 2>/dev/null || true

      # ===== Commit All =====
      - name: Commit all assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/assets/ output/
          git commit -m "Update profile assets" || exit 0
          git push
